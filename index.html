const DAYS=["周一","周二","周三","周四","周五","周六","周日"];
const ACT={sedentary:["久坐(×1.2)",1.2],split3:["三分化(×1.3)",1.3],freq5:["五次(×1.5)",1.5],freq7:["七次(×1.7)",1.7]};
const CATS=["全部","主食","蛋白质","蔬菜","水果","油脂","饮品","补剂","自定义","AI"];

// ===== STATE =====
let S=load()||{
  page:"setup",tab:"diet",
  prof:{weight:90,height:180,bodyFat:20,activity:"split3",fastDays:[5,6],apiKey:""},
  foods:JSON.parse(JSON.stringify(INIT_FOODS)),
  // key: "2026-04-15", value: [{name,grams,c,p,f,cal,cat}]
  dailyLog:{},
  // body measurements: [{date:"2026-04-15",weight:90,bodyFat:20,waist:85,arm:35}]
  bodyLog:[],
  selDate:todayStr(),
  showAdd:false,showCustom:false,showBody:false,
  q:"",catF:"全部",
  aiQ:"",aiL:false,aiR:null,aiE:"",
  addGrams:100,
};

function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateToWeekday(ds){const d=new Date(ds);const wd=d.getDay();return wd===0?6:wd-1}
function load(){try{const s=localStorage.getItem("d52v4");return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{const s={...S,showAdd:false,showCustom:false,showBody:false,aiL:false,aiR:null,aiE:""};localStorage.setItem("d52v4",JSON.stringify(s))}catch(e){}}
function U(u){Object.assign(S,u);render();save()}

// ===== CALC =====
function calc(){
  const p=S.prof,lean=p.weight*(1-p.bodyFat/100),rmr=25.2*p.weight;
  const tdee=Math.round(rmr*ACT[p.activity][1]),minC=Math.round(lean*30);
  const cpk=lkCarb(p.weight,p.height);
  const wd=dateToWeekday(S.selDate),isFast=p.fastDays.includes(wd);
  let tgt;
  if(isFast){const pg=Math.round(p.weight*1.6),rem=Math.max(0,900-pg*4);tgt={cal:900,c:Math.round(rem*.3/4),p:pg,f:Math.round(rem*.7/9),type:"断食日"}}
  else{const cg=Math.round(p.weight*cpk),pg=Math.round(p.weight*1.8),fg=Math.round(p.weight*.5),tot=cg*4+pg*4+fg*9;tgt={cal:Math.max(tot,tdee,minC),c:cg,p:pg,f:fg,type:"正常日"}}
  const meals=S.dailyLog[S.selDate]||[];
  const act=meals.reduce((a,m)=>({cal:a.cal+m.cal,c:a.c+m.c,p:a.p+m.p,f:a.f+m.f}),{cal:0,c:0,p:0,f:0});
  return{lean,rmr,tdee,minC,cpk,isFast,tgt,act,wd};
}

// ===== FOOD CALC BY GRAMS =====
function calcByGrams(food,grams){
  const r=grams/100;
  return{name:food.name,cat:food.cat,grams,c:Math.round(food.c*r*10)/10,p:Math.round(food.p*r*10)/10,f:Math.round(food.f*r*10)/10,cal:Math.round(food.cal*r)};
}

// ===== DeepSeek =====
async function askAI(){
  if(!S.aiQ.trim())return;
  if(!S.prof.apiKey){U({aiE:"请先在设置页填写API Key"});return}
  U({aiL:true,aiE:"",aiR:null});
  try{
    const r=await fetch("https://api.deepseek.com/chat/completions",{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.prof.apiKey},
      body:JSON.stringify({model:"deepseek-chat",temperature:.1,max_tokens:200,
        messages:[{role:"system",content:'你是食物营养数据库。用户输入食物名，返回该食物每100g的营养数据。严格按JSON返回：{"name":"食物名","carb":碳水克数,"protein":蛋白质克数,"fat":脂肪克数,"cal":热量千卡}。只返回JSON。'},{role:"user",content:S.aiQ.trim()}]})});
    const d=await r.json();if(d.error)throw new Error(d.error.message);
    const txt=d.choices?.[0]?.message?.content||"",m=txt.match(/\{[\s\S]*\}/);
    if(!m)throw new Error("AI返回格式异常");
    const j=JSON.parse(m[0]);const cc=Math.round(j.carb*4+j.protein*4+j.fat*9);
    U({aiL:false,aiR:{cat:"AI",name:j.name||S.aiQ,c:Math.round(j.carb*10)/10,p:Math.round(j.protein*10)/10,f:Math.round(j.fat*10)/10,cal:Math.abs(cc-(j.cal||0))>20?cc:Math.round(j.cal)}});
  }catch(e){U({aiL:false,aiE:e.message||"查询失败"})}
}

function addFoodToLog(food,grams){
  const entry=calcByGrams(food,grams);
  if(!S.dailyLog[S.selDate])S.dailyLog[S.selDate]=[];
  S.dailyLog[S.selDate].push(entry);
  U({showAdd:false,q:"",catF:"全部",addGrams:100});
}
function rmFood(i){S.dailyLog[S.selDate].splice(i,1);U({})}

function addAiToDb(){
  if(!S.aiR)return;
  S.foods.push(S.aiR);
  addFoodToLog(S.aiR,S.addGrams);
  U({aiR:null,aiQ:""});
}

function addCustomFood(name,c,p,f){
  const cal=Math.round(c*4+p*4+f*9);
  const food={cat:"自定义",name,c,p,f,cal};
  S.foods.push(food);
  U({showCustom:false});
}

function addBodyEntry(entry){
  S.bodyLog.push(entry);
  S.bodyLog.sort((a,b)=>a.date>b.date?-1:1);
  U({showBody:false});
}

function toggleFast(d){const fd=S.prof.fastDays;if(fd.includes(d))fd.splice(fd.indexOf(d),1);else{fd.push(d);if(fd.length>2)fd.shift()}U({})}

// ===== DATE NAV =====
function shiftDate(n){const d=new Date(S.selDate);d.setDate(d.getDate()+n);U({selDate:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})}
function fmtDate(ds){const d=new Date(ds);return (d.getMonth()+1)+"月"+d.getDate()+"日 "+DAYS[dateToWeekday(ds)]}

// ===== DOM HELPER =====
function h(t,a,...k){const e=document.createElement(t);if(a)Object.entries(a).forEach(([k,v])=>{if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==="className")e.className=v;else e.setAttribute(k,v)});k.flat(9).forEach(c=>{if(c!=null)e.append(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c)});return e}
function inp(cls,attrs){const i=h("input",{className:cls,...attrs});return i}

      h("div",null,h("span",{className:"lbl"},"选2天断食日"),

      h("div",{style:{marginTop:14}},h("span",{className:"lbl"},"DeepSeek API Key"),

      h("div",{style:{marginTop:8,borderTop:"1px dashed #bbf7d0",paddingTop:8}},
        mRow("碳水配额",cpk+"g/kg → "+Math.round(p.weight*cpk)+"g/天"),
        mRow("蛋白质","1.8g/kg → "+Math.round(p.weight*1.8)+"g/天"),
        mRow("脂肪","0.5g/kg → "+Math.round(p.weight*.5)+"g/天")),
      h("div",{style:{marginTop:8,fontSize:11,color:"#166534",background:"#dcfce7",borderRadius:8,padding:"6px 10px"}},
        "正常日 "+Math.round(p.weight*cpk*4+p.weight*1.8*4+p.weight*.5*9)+"kcal · 断食日 900kcal")),
    h("div",{className:"card",style:{background:"#fef3c7",marginBottom:18}},
      h("div",{style:{fontWeight:700,fontSize:13,marginBottom:6,color:"#92400e"}},"💡 新功能说明"),
      mTip("所有食物按100g存储，输入任意克数自动算碳蛋脂热量"),
      mTip("可自定义食物：输入名称和每100g的碳蛋脂即可"),
      mTip("每天数据按日期永久保存，可翻看历史任何一天"),
      mTip("体围记录：随时记录腰围/臂围/体重/体脂，灵活不限日期")),
    h("button",{className:"btn-p",onClick:()=>U({page:"track"})},"开始使用 →"));
}

function rTrack(){
  const{isFast,tgt,act,cpk,tdee,wd}=calc(),p=S.prof;
  const rem={cal:tgt.cal-act.cal,c:tgt.c-act.c,p:tgt.p-act.p};
  const meals=S.dailyLog[S.selDate]||[];

  const root=h("div",null,
    // Tab bar
    h("div",{className:"tab"},
      h("button",{className:S.tab==="diet"?"a":"",onClick:()=>U({tab:"diet"})},"🍽 饮食"),
      h("button",{className:S.tab==="body"?"a":"",onClick:()=>U({tab:"body"})},"📏 体围"),
      h("button",{className:S.tab==="history"?"a":"",onClick:()=>U({tab:"history"})},"📅 历史")),

    S.tab==="diet"?rDietTab(isFast,tgt,act,rem,meals,cpk,tdee,wd,p):null,
    S.tab==="body"?rBodyTab():null,
    S.tab==="history"?rHistoryTab():null,

    // Bottom bar
    h("div",{className:"bb"},
      h("button",{style:{padding:"7px 16px",borderRadius:10,border:"none",background:"#f3f4f6",color:"#6b7280",fontSize:12,fontWeight:600,cursor:"pointer"},onClick:()=>U({page:"setup"})},"⚙ 设置"),
      S.tab==="diet"?h("button",{className:"btn-s",style:{padding:"7px 24px"},onClick:()=>U({showAdd:true,aiR:null,aiE:"",aiQ:"",addGrams:100})},"+ 记录饮食"):null,
      S.tab==="body"?h("button",{className:"btn-s",style:{padding:"7px 24px"},onClick:()=>U({showBody:true})},"+ 记录体围"):null)
  );

  if(S.showAdd)root.append(rAddModal(isFast));
  if(S.showCustom)root.append(rCustomModal());
  if(S.showBody)root.append(rBodyModal());
  return root;
}

function rDietTab(isFast,tgt,act,rem,meals,cpk,tdee,wd,p){
  return h("div",{className:"fade"},
    // Date nav
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:12,marginBottom:14}},
      h("button",{style:{border:"none",background:"none",fontSize:20,cursor:"pointer",color:"#6366f1"},onClick:()=>shiftDate(-1)},"‹"),
      h("div",{style:{fontSize:15,fontWeight:700,textAlign:"center",minWidth:140}},fmtDate(S.selDate),
        S.selDate===todayStr()?h("span",{style:{fontSize:10,background:"#dcfce7",color:"#166534",padding:"1px 6px",borderRadius:4,marginLeft:6}},"今天"):null),
      h("button",{style:{border:"none",background:"none",fontSize:20,cursor:"pointer",color:"#6366f1"},onClick:()=>shiftDate(1)},"›")),
    // Status
    h("div",{className:"fade",style:{background:isFast?"linear-gradient(135deg,#fef2f2,#fee2e2)":"linear-gradient(135deg,#eef2ff,#e0e7ff)",borderRadius:18,padding:18,marginBottom:14}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
        h("div",null,h("div",{style:{fontSize:18,fontWeight:800}},tgt.type),h("div",{style:{fontSize:11,color:"#6b7280",marginTop:2}},isFast?"蛋白+蔬菜·黑咖啡·疯狂练":"碳水"+cpk+"g/kg·蛋白1.8·脂肪0.5")),
        h("div",{style:{textAlign:"right"}},h("div",{style:{fontSize:26,fontWeight:900,color:act.cal>tgt.cal*1.05?"#dc2626":"#1e1b4b"}},Math.round(act.cal)),h("div",{style:{fontSize:10,color:"#6b7280"}},"/ "+tgt.cal+" kcal"))),
      mBar("热量",act.cal,tgt.cal,"#6366f1","kcal"),mBar("碳水",act.c,tgt.c,"#f59e0b","g"),mBar("蛋白",act.p,tgt.p,"#ef4444","g"),mBar("脂肪",act.f,tgt.f,"#10b981","g")),
    // Tips
    isFast?h("div",{style:{background:"#fef3c7",borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#92400e",lineHeight:1.6}},h("b",null,"🔥断食日")," 蛋白目标"+tgt.p+"g·菠菜补镁钾·黑咖啡·疯狂练！"):null,
    !isFast&&act.cal>0&&rem.cal>100?h("div",{style:{background:"#dbeafe",borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#1e40af",lineHeight:1.6}},h("b",null,"📢")," 还差",h("b",null,Math.round(rem.cal)+"kcal"),"·碳水还需",h("b",null,Math.max(0,Math.round(rem.c))+"g"),"·蛋白还需",h("b",null,Math.max(0,Math.round(rem.p))+"g")):null,
    // Meals
    h("div",{style:{marginBottom:14}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},h("div",{style:{fontSize:15,fontWeight:700}},"饮食记录 ("+meals.length+"条)")),
      meals.length===0?h("div",{style:{textAlign:"center",padding:24,color:"#9ca3af",fontSize:13,background:"#f9fafb",borderRadius:12}},"暂无记录"):null,
      ...meals.map((m,i)=>h("div",{style:{display:"flex",alignItems:"center",padding:"10px 12px",background:"#fff",borderRadius:11,marginBottom:5,border:"1px solid #f0f0f0"}},
        h("div",{style:{flex:1}},
          h("div",{style:{fontWeight:600,fontSize:13}},m.name," ",h("span",{style:{color:"#a5b4fc"}},(m.grams||0)+"g"),
            m.cat==="AI"?h("span",{style:{fontSize:9,background:"#ede9fe",color:"#6366f1",padding:"1px 5px",borderRadius:4,marginLeft:4}},"AI"):null,
            m.cat==="自定义"?h("span",{style:{fontSize:9,background:"#fef3c7",color:"#92400e",padding:"1px 5px",borderRadius:4,marginLeft:4}},"自定义"):null),
          h("div",{style:{fontSize:10,color:"#6b7280",marginTop:1}},h("b",null,m.cal+"kcal"),"·碳"+m.c+"g·蛋"+m.p+"g·脂"+m.f+"g")),
        h("button",{className:"qb",style:{background:"#fee2e2",color:"#dc2626"},onClick:()=>rmFood(i)},"×"))))
  );
}

function rBodyTab(){
  const logs=S.bodyLog;
  return h("div",{className:"fade"},
    h("div",{style:{fontSize:16,fontWeight:700,marginBottom:12}},"📏 体围记录"),
    logs.length===0?h("div",{style:{textAlign:"center",padding:32,color:"#9ca3af",fontSize:13,background:"#f9fafb",borderRadius:12}},"还没有记录，点底部「+ 记录体围」添加"):null,
    ...logs.map((l,i)=>h("div",{className:"card",style:{background:"#fff",border:"1px solid #f0f0f0",marginBottom:8}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
        h("div",{style:{fontWeight:700,fontSize:14}},l.date),
        h("button",{style:{border:"none",background:"#fee2e2",color:"#dc2626",borderRadius:6,padding:"2px 8px",fontSize:11,cursor:"pointer"},onClick:()=>{S.bodyLog.splice(i,1);U({})}},"删除")),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:8}},
        l.weight?mMt("体重",l.weight+"kg","#6366f1"):null,
        l.bodyFat?mMt("体脂",l.bodyFat+"%","#ef4444"):null,
        l.waist?mMt("腰围",l.waist+"cm","#f59e0b"):null,
        l.arm?mMt("臂围",l.arm+"cm","#10b981"):null)))
  );
}

function rHistoryTab(){
  const dates=Object.keys(S.dailyLog).sort((a,b)=>b>a?1:-1);
  return h("div",{className:"fade"},
    h("div",{style:{fontSize:16,fontWeight:700,marginBottom:12}},"📅 历史记录"),
    dates.length===0?h("div",{style:{textAlign:"center",padding:32,color:"#9ca3af",fontSize:13,background:"#f9fafb",borderRadius:12}},"还没有记录"):null,
    ...dates.map(d=>{
      const meals=S.dailyLog[d];
      const tot=meals.reduce((a,m)=>({cal:a.cal+m.cal,c:a.c+m.c,p:a.p+m.p,f:a.f+m.f}),{cal:0,c:0,p:0,f:0});
      const fast=S.prof.fastDays.includes(dateToWeekday(d));
      return h("div",{className:"card",style:{background:"#fff",border:"1px solid #f0f0f0",cursor:"pointer",marginBottom:8},onClick:()=>U({selDate:d,tab:"diet"})},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h("div",null,h("span",{style:{fontWeight:700,fontSize:14}},fmtDate(d)),h("span",{style:{fontSize:10,marginLeft:6,color:fast?"#dc2626":"#6366f1",fontWeight:600}},fast?"断食":"正常")),
          h("div",{style:{fontWeight:800,fontSize:15}},Math.round(tot.cal)+"kcal")),
        h("div",{style:{fontSize:11,color:"#6b7280",marginTop:4}},meals.length+"条记录·碳"+Math.round(tot.c)+"g·蛋"+Math.round(tot.p)+"g·脂"+Math.round(tot.f)+"g"))
    })
  );
}

// ===== MODALS =====
function rAddModal(isFast){
  const filtered=S.foods.filter(f=>(S.catF==="全部"||f.cat===S.catF)&&(!S.q||f.name.toLowerCase().includes(S.q.toLowerCase())));
  return h("div",{className:"mbg",onClick:()=>U({showAdd:false,q:"",catF:"全部",aiR:null,aiE:""})},
    h("div",{className:"msh",onClick:e=>e.stopPropagation()},
      h("div",{style:{fontWeight:800,fontSize:17,marginBottom:10}},isFast?"🥗 断食日食物":"🍱 选择食物"),
      // AI
      h("div",{style:{background:"linear-gradient(135deg,#eff6ff,#ede9fe)",borderRadius:12,padding:14,marginBottom:10}},
        h("div",{style:{fontSize:13,fontWeight:700,marginBottom:4}},"🤖 AI查询 / ✏️ 自定义"),
        h("div",{style:{display:"flex",gap:6}},
          (()=>{const i=h("input",{className:"inp-sm",style:{flex:1},placeholder:"AI查食物...",value:S.aiQ});i.oninput=e=>{S.aiQ=e.target.value};i.onkeydown=e=>{if(e.key==="Enter")askAI()};return i})(),
          h("button",{style:{padding:"8px 12px",borderRadius:9,border:"none",fontSize:12,fontWeight:700,cursor:"pointer",background:S.aiL?"#c7d2fe":"#6366f1",color:"#fff",whiteSpace:"nowrap"},onClick:askAI},S.aiL?"...":"AI查"),
          h("button",{style:{padding:"8px 12px",borderRadius:9,border:"none",fontSize:12,fontWeight:700,cursor:"pointer",background:"#f59e0b",color:"#fff",whiteSpace:"nowrap"},onClick:()=>U({showCustom:true,showAdd:false})},"自定义")),
        S.aiE?h("div",{style:{marginTop:6,fontSize:11,color:"#dc2626",background:"#fef2f2",borderRadius:6,padding:"4px 8px"}},S.aiE):null,
        S.aiR?h("div",{className:"fade",style:{marginTop:10,background:"#fff",borderRadius:10,padding:12,border:"1px solid #e0e7ff"}},
          h("div",{style:{fontSize:14,fontWeight:700,marginBottom:4}},S.aiR.name," ",h("span",{style:{fontSize:11,color:"#6b7280"}},"(每100g)")),
          h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:8}},
            mMt("热量",S.aiR.cal+"kcal","#6366f1"),mMt("碳水",S.aiR.c+"g","#f59e0b"),mMt("蛋白",S.aiR.p+"g","#ef4444"),mMt("脂肪",S.aiR.f+"g","#10b981")),
          h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
            h("span",{style:{fontSize:12,fontWeight:600}},"克数:"),
            (()=>{const i=h("input",{className:"inp-sm",type:"number",style:{width:70},value:S.addGrams});i.oninput=e=>{S.addGrams=+e.target.value||0};return i})(),
            h("span",{style:{fontSize:11,color:"#6b7280"}},"→ "+Math.round(S.aiR.cal*S.addGrams/100)+"kcal")),
          h("button",{style:{width:"100%",marginTop:8,padding:10,borderRadius:10,border:"none",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"},onClick:addAiToDb},"✅ 添加"+S.addGrams+"g到记录")
        ):null),
      // Search
      (()=>{const i=h("input",{className:"inp",style:{marginBottom:8},placeholder:"搜索食物库...",value:S.q});i.oninput=e=>{S.q=e.target.value;render()};return i})(),
      h("div",{style:{display:"flex",gap:4,marginBottom:10,flexWrap:"wrap"}},...CATS.map(c=>h("button",{className:"cb",style:{background:S.catF===c?"#6366f1":"#f3f4f6",color:S.catF===c?"#fff":"#6b7280"},onClick:()=>{S.catF=c;render()}},c))),
      // Food list
      h("div",{style:{flex:1,overflow:"auto",minHeight:0}},
        ...filtered.map(f=>{
          const rec=isFast&&(f.p>10||f.c<5);const isAi=f.cat==="AI";const isCus=f.cat==="自定义";
          return h("div",{className:"fi",style:{background:rec?"#f0fdf4":isAi?"#faf5ff":isCus?"#fffbeb":"transparent",borderLeft:rec?"3px solid #22c55e":isAi?"3px solid #8b5cf6":isCus?"3px solid #f59e0b":"3px solid transparent"},
            onClick:()=>{
              const grams=prompt("输入克数（例如125）：","100");
              if(grams&&+grams>0)addFoodToLog(f,+grams);
            }},
            h("div",{style:{flex:1}},
              h("div",{style:{fontWeight:600,fontSize:13}},f.name," ",h("span",{style:{color:"#9ca3af",fontSize:10}},"每100g"),
                rec?h("span",{style:{fontSize:9,background:"#dcfce7",color:"#166534",padding:"1px 5px",borderRadius:4,marginLeft:4}},"断食推荐"):null,
                isAi?h("span",{style:{fontSize:9,background:"#ede9fe",color:"#6366f1",padding:"1px 5px",borderRadius:4,marginLeft:4}},"AI"):null,
                isCus?h("span",{style:{fontSize:9,background:"#fef3c7",color:"#92400e",padding:"1px 5px",borderRadius:4,marginLeft:4}},"自定义"):null),
              h("div",{style:{fontSize:10,color:"#6b7280",marginTop:1}},h("b",null,f.cal+"kcal"),"·碳"+f.c+"g·蛋"+f.p+"g·脂"+f.f+"g")),
            h("div",{style:{fontSize:18,color:"#6366f1",fontWeight:700}},"+"))
        }))
    ));
}

function rCustomModal(){
  let nm="",cc=0,pp=0,ff=0;
  return h("div",{className:"mbg",onClick:()=>U({showCustom:false})},
    h("div",{className:"msh",style:{maxHeight:"50vh"},onClick:e=>e.stopPropagation()},
      h("div",{style:{fontWeight:800,fontSize:17,marginBottom:12}},"✏️ 自定义食物 (每100g)"),
      h("div",{style:{marginBottom:10}},h("span",{className:"lbl"},"食物名称"),(()=>{const i=h("input",{className:"inp",placeholder:"如：肉夹馍"});i.oninput=e=>{nm=e.target.value};return i})()),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}},
        h("div",null,h("span",{className:"lbl"},"碳水(g)"),(()=>{const i=h("input",{className:"inp",type:"number",placeholder:"0"});i.oninput=e=>{cc=+e.target.value};return i})()),
        h("div",null,h("span",{className:"lbl"},"蛋白(g)"),(()=>{const i=h("input",{className:"inp",type:"number",placeholder:"0"});i.oninput=e=>{pp=+e.target.value};return i})()),
        h("div",null,h("span",{className:"lbl"},"脂肪(g)"),(()=>{const i=h("input",{className:"inp",type:"number",placeholder:"0"});i.oninput=e=>{ff=+e.target.value};return i})())),
      h("div",{style:{fontSize:12,color:"#6b7280",marginBottom:12}},"热量会自动计算：碳水×4+蛋白×4+脂肪×9"),
      h("button",{className:"btn-p",onClick:()=>{if(!nm.trim()){alert("请输入食物名称");return}addCustomFood(nm,cc,pp,ff)}},"保存到食物库")));
}

function rBodyModal(){
  let dt=todayStr(),wt="",bf="",ws="",arm="";
  return h("div",{className:"mbg",onClick:()=>U({showBody:false})},
    h("div",{className:"msh",style:{maxHeight:"60vh"},onClick:e=>e.stopPropagation()},
      h("div",{style:{fontWeight:800,fontSize:17,marginBottom:12}},"📏 记录体围数据"),
      h("div",{style:{marginBottom:10}},h("span",{className:"lbl"},"日期"),(()=>{const i=h("input",{className:"inp",type:"date",value:dt});i.oninput=e=>{dt=e.target.value};return i})()),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:12}},
        h("div",null,h("span",{className:"lbl"},"体重(kg)"),(()=>{const i=h("input",{className:"inp",type:"number",placeholder:"选填"});i.oninput=e=>{wt=e.target.value};return i})()),
        h("div",null,h("span",{className:"lbl"},"体脂(%)"),(()=>{const i=h("input",{className:"inp",type:"number",placeholder:"选填"});i.oninput=e=>{bf=e.target.value};return i})()),
        h("div",null,h("span",{className:"lbl"},"腰围(cm)"),(()=>{const i=h("input",{className:"inp",type:"number",placeholder:"选填"});i.oninput=e=>{ws=e.target.value};return i})()),
        h("div",null,h("span",{className:"lbl"},"臂围(cm)"),(()=>{const i=h("input",{className:"inp",type:"number",placeholder:"选填"});i.oninput=e=>{arm=e.target.value};return i})())),
      h("div",{style:{fontSize:12,color:"#6b7280",marginBottom:12}},"所有字段均为选填，记录你想记录的即可"),
      h("button",{className:"btn-p",onClick:()=>{
        const e={date:dt};if(wt)e.weight=+wt;if(bf)e.bodyFat=+bf;if(ws)e.waist=+ws;if(arm)e.arm=+arm;
        if(Object.keys(e).length<=1){alert("请至少填一项数据");return}addBodyEntry(e)}},"保存记录")));
}

// ===== SMALL COMPONENTS =====
function mField(l,v,fn){const w=h("label",{style:{display:"block",marginBottom:14}},h("span",{className:"lbl"},l));const i=h("input",{className:"inp",type:"number",value:v});i.oninput=e=>fn(e.target.value);w.append(i);return w}
function mRow(l,v){return h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12,lineHeight:"1.8"}},h("span",{style:{color:"#374151"}},l),h("b",null,v))}
function mTip(t){return h("div",{className:"tip"},"• "+t)}
function mBar(l,c,m,co,u){const p=Math.min(100,Math.round(c/Math.max(m,1)*100)),o=c>m*1.05;
  return h("div",{style:{marginBottom:8}},h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}},h("span",{style:{fontWeight:700}},l),h("span",{style:{color:o?"#dc2626":"#6b7280"}},Math.round(c)+"/"+m+u+(o?" ⚠超标":""))),h("div",{className:"bar-t"},h("div",{className:"bar-f",style:{width:p+"%",background:o?"#dc2626":co}})))}
function mMt(l,v,co){return h("div",{className:"mt",style:{background:co+"11"}},h("div",{style:{fontSize:10,color:"#6b7280"}},l),h("div",{style:{fontSize:13,fontWeight:700,color:co,marginTop:2}},v))}

render();
</script>
